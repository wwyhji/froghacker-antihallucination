[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "froghacker-antihallucination"
version = "0.1.0"
description = "蛙客算法抗幻觉开源版 — 四层确定性验证 + FactGate 事实断言裁决"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "FrogHacker (wwyhji)" }]
keywords = ["llm", "anti-hallucination", "fact-checking", "verification", "ai-safety"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # 纯标准库，零第三方依赖

[project.urls]
Homepage = "https://github.com/wwyhji/froghacker-antihallucination"

[tool.setuptools.packages.find]
include = ["antihallucination*"]
